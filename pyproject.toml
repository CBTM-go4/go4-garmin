[project]
name = "garmin-coach"
version = "0.1.0"
description = "Local running coach & health dashboard powered by the Garmin MCP server"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "garminconnect>=0.3.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
garmin-coach = "server.app:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
